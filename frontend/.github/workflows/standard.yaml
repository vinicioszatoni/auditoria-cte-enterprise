on:
  push:
    branches:
      - main
    paths-ignore:
      - '**/*.md'
      - '.scafflater/**'
  pull_request:
    branches:
      - main
    paths-ignore:
      - '**/*.md'
      - '.scafflater/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

name: Standard

jobs:
  ci:
    name: CI - Build and Test
    runs-on: [vs-plataforma-logistica-arm]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          cache: npm
          node-version-file: .nvmrc
          registry-url: https://npm.pkg.github.com/
      - name: Install Dependencies
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GHA_PACKAGES }}
      - name: Test
        run: npm run test
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Sonar Analysis
        uses: grupoboticario/actions-ci-sonarcloud@v1
        if: ${{ vars.SONAR_ENABLED == 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONARCLOUD_TOKEN }}
      - name: Generate Artifact
        run: |
          cd dist
          tar -I 'gzip -9' -cvf ${{ github.run_number }}.tar.gz *
      - uses: actions/upload-artifact@v7
        if: ${{ github.actor != 'dependabot[bot]' }}
        with:
          name: ${{ github.run_number }}
          path: dist/${{ github.run_number }}.tar.gz
          if-no-files-found: error
  cd_hml:
    name: CD - hml
    if: ${{ success() && github.event_name != 'pull_request' && github.actor != 'dependabot[bot]' }}
    needs: [ci]
    runs-on: [vs-plataforma-logistica-arm]
    environment:
      name: hml
      url: ${{ steps.actions-cd-app.outputs.environment-url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Deploy Infra
        uses: grupoboticario/actions-cd-alquimia@v2
        id: actions-cd-infra
        with:
          environment: aws-plataforma-logistica-hml
          type: infra
      - name: Deploy App
        uses: grupoboticario/actions-cd-alquimia@v2
        id: actions-cd-app
        with:
          environment: aws-plataforma-logistica-hml
          token-prefix: '{{'
          token-suffix: '}}'
        env:
          APP_NAME: 'auditoria-cte-frontend'
          VITE_PUBLIC_URL: auditoria-cte

  cd_prd:
    name: CD - prd
    if: ${{ success() && github.ref == 'refs/heads/main' }}
    needs: [cd_hml]
    runs-on: [vs-plataforma-logistica-arm]
    environment:
      name: prd
      url: ${{ steps.actions-cd-app.outputs.environment-url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Deploy Infra
        uses: grupoboticario/actions-cd-alquimia@v2
        id: actions-cd-infra
        with:
          environment: aws-plataforma-logistica-prd
          type: infra
      - name: Deploy App
        uses: grupoboticario/actions-cd-alquimia@v2
        id: actions-cd-app
        with:
          environment: aws-plataforma-logistica-prd
          token-prefix: '{{'
          token-suffix: '}}'
        env:
          APP_NAME: 'auditoria-cte-frontend'
          VITE_PUBLIC_URL: auditoria-cte
