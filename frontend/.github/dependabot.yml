version: 2

registries:
  github-packages-npm-grupoboticario:
    type: npm-registry
    url: https://npm.pkg.github.com
    scope: '@grupoboticario'
    token: ${{ secrets.GHA_PACKAGES }}

updates:
  - package-ecosystem: github-actions
    directory: /
    open-pull-requests-limit: 10
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /
    open-pull-requests-limit: 10
    registries:
      - github-packages-npm-grupoboticario
    schedule:
      interval: weekly
    groups:
      non-major:
        update-types:
          - minor
          - patch
